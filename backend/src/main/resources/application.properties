spring.application.name=shipflow-backend

server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/${POSTGRES_DB:shipflow}
spring.datasource.username=${POSTGRES_USER:shipflow}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver


# Hibernate: Flyway gestionará el esquema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Flyway
spring.flyway.enabled=true

# MongoDB
spring.data.mongodb.uri=${MONGODB_URI}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
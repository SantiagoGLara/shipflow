apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: shipflow-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - shipflow-prod.localhost
      secretName: shipflow-prod-tls
  rules:
    - host: shipflow-prod.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: mongo-check
          image: mongo:7.0
          command: ["bash", "-ec"]
          args:
            - if timeout 8 mongosh --host mongo.shipflow-prod.svc.cluster.local --port 27017 --tls --tlsCAFile /etc/mongo-tls/ca.crt --tlsCertificateKeyFile /etc/mongo-client/client.pem --username shipflow_app --password "$MONGO_APP_PASSWORD" --authenticationDatabase shipflow shipflow --quiet --eval 'db.adminCommand({ping:1}).ok'; then echo UNEXPECTED_ALLOWED; exit 1; else echo DENIED_EXPECTED; fi
          env:

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend
  namespace: shipflow-dev
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - localhost
      secretName: shipflow-dev-tls
  rules:
    - host: localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80

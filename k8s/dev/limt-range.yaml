apiVersion: v1
kind: LimitRange
metadata:
  name: shipflow-dev-limits
  namespace: shipflow-dev
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
      min:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: "8"
        memory: 8Gi
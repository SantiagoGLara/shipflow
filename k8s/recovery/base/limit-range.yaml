apiVersion: v1
kind: LimitRange
metadata:
  name: shipflow-recovery-limits
  namespace: shipflow-recovery
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
      max:
        cpu: "2"
        memory: 3Gi
